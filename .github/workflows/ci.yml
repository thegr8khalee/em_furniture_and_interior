name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A new push supersedes the run in flight for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Skips puppeteer's ~170MB Chromium download. No test launches a browser.
  PUPPETEER_SKIP_DOWNLOAD: 'true'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    # The schema tests assert that PostgreSQL rejects bad data. A fake or
    # in-memory substitute enforces none of it, so it would report a pass for
    # constraints nobody verified — the exact failure this migration removes.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      # One install for the whole workspace — npm links @em/* into node_modules.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Test all workspaces
        run: npm test --workspaces --if-present

      - name: Migrations apply cleanly from scratch, and are idempotent
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/migration_check
        run: |
          set -e
          psql "postgres://postgres:postgres@127.0.0.1:5432/postgres" -c 'CREATE DATABASE migration_check'
          npm run migrate
          before=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM schema_migrations")
          npm run migrate
          after=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM schema_migrations")
          if [ "$before" != "$after" ]; then
            echo "::error::a second migration run changed the schema — migrations are not idempotent"
            exit 1
          fi
          echo "migrations idempotent ($before applied)"

      # Reported, not enforced. The tree carries pre-existing violations, and
      # gating on lint today would mean a CI that is red on arrival and
      # therefore ignored. Clear the backlog, then drop continue-on-error.
      - name: Lint (non-blocking)
        run: npm run lint --workspaces --if-present
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci --ignore-scripts

      - name: Build storefront and console
        run: npm run build

      # The whole point of splitting the apps: console code must not reach a
      # public visitor. This fails the build if any of it leaks back in.
      - name: Assert no console code in the public bundle
        run: |
          set -e
          test -d apps/web/dist/assets || { echo "storefront bundle missing"; exit 1; }
          test -d apps/erp/dist/assets  || { echo "console bundle missing"; exit 1; }
          status=0
          for term in AdminSideBar SecurityLogs DocumentBuilder InventoryManagement \
                      FinanceReports ConsultationManagement admin/security-logs tinymce; do
            if grep -rqs -- "$term" apps/web/dist/assets; then
              echo "::error::'$term' leaked into the storefront bundle"
              status=1
            fi
            # Positive control: the term must be findable in the console bundle,
            # otherwise the check above passes for the wrong reason.
            if ! grep -rqs -- "$term" apps/erp/dist/assets; then
              echo "::warning::'$term' not found in the console bundle either — marker may be stale"
            fi
          done
          exit $status

  api-spec:
    name: API spec
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # swagger.js reads these at boot, so a malformed file crashes the server
      # on deploy rather than failing here.
      - name: Check the OpenAPI spec parses
        run: node -e "JSON.parse(require('fs').readFileSync('docs/swagger.json','utf8')); console.log('swagger.json OK')"

      - name: Check the Postman collection parses
        run: node -e "JSON.parse(require('fs').readFileSync('docs/EM_Furniture_API.postman_collection.json','utf8')); console.log('postman collection OK')"

      - name: Check the removed gateways stay removed
        run: |
          if grep -qi 'flutterwave\|stripe' docs/swagger.json docs/EM_Furniture_API.postman_collection.json; then
            echo "::error::a removed payment gateway reappeared in the API docs"
            exit 1
          fi
          echo "docs are Paystack-only"
