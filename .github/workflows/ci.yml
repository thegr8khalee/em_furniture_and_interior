name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A newer push to the same branch cancels the older run — CI minutes are better
# spent on the current head than on a commit nobody is waiting for.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      # Puppeteer pulls a ~150 MB Chromium in postinstall for PDF rendering.
      # Nothing in the test suite renders a PDF, so skip the download and keep
      # the job fast. Remove this once there are PDF tests to run.
      - name: Install dependencies
        working-directory: apps/api
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci

      - name: Test
        working-directory: apps/api
        run: npm test

      # No API lint step: apps/api declares no lint script and
      # the workspace has no ESLint config. Adding both is tracked as part of
      # finding F-13 rather than bolted on here.

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: apps/storefront
        run: npm ci

      # The storefront carries 68 pre-existing lint errors. Gating on zero would
      # make CI red on arrival, so the gate is a per-file ratchet: counts may
      # fall, never rise. See .github/lint-baseline.json.
      # Both workspaces are ratcheted. Linting only the app would let debt vanish
      # by moving a file into the package, which is exactly what the R1
      # extraction does.
      - name: Lint (ratchet)
        run: |
          node .github/scripts/lint-ratchet.mjs apps/storefront
          node .github/scripts/lint-ratchet.mjs packages/ui

      - name: Test
        working-directory: apps/storefront
        run: npm test -w apps/storefront

      - name: Build
        working-directory: apps/storefront
        run: npm run build

  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Pinned to the repo's Playwright version so the browser build matches the
      # one the committed baselines were captured with. A different Chromium
      # renders text slightly differently and every snapshot diffs.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Guards the R1 parity constraint: the split must not change rendering.
      - name: Visual regression
        run: npm run test:visual

      - name: Structural checks
        run: npx playwright test --config e2e/playwright.config.js structure.spec.js

      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/test-results
          retention-days: 7

  api-spec:
    name: API spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Placeholder for the generated-spec drift gate described in
      # context/06-replatform-plan.md section 6. Until the spec is generated
      # from route schemas it is hand-maintained, so the most CI can assert is
      # that it parses and that every route file has a corresponding path.
      - name: Validate OpenAPI and Postman documents
        run: node .github/scripts/check-api-docs.mjs
